; ============================================================
;  智哨 Smart Sentinel · AI 视觉主控（ESP32-S3-N16R8 + OV7670）
;  与 code-project-1（主控）分开成独立工程，两块板固件互不干扰
; ============================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; —— N16R8：16MB QIO Flash + 8MB OPI PSRAM ——
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

; 日志走原生 USB 口（板上标 USB 的那个口），与主控工程习惯一致
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    ; esp32-camera 不在 PlatformIO 注册表里，它随 arduino-esp32 内核捆绑，
    ; #include "esp_camera.h" 直接可用，不需要写在这里
