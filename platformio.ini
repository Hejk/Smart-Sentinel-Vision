; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:mirror_hello.py
; ★ 2026-10-13 死循环修复（rst:0x3、bootloader 零日志）：原 qio_opi +
;   flash_mode=qio 把 bootloader 切到激进变体（镜像头 byte3 0x4F，
;   V1 能跑的是 0x3F），本板 flash 初始化即死。回退 DIO 保守模式（V1 同款），
;   PSRAM 保留 OPI（N16R8 八线 PSRAM 必须 opi）。
; ★ 2026-10-13 排障中：dio_opi 变体仍死循环（bootloader 零日志、rst:0x3）。
;   现与 V1 完全同款（默认变体，不碰 PSRAM），用于二分：
;   若能跑 → 死因锁定 OPI PSRAM 初始化（板载 PSRAM 硬件嫌疑）；
;   应用层会打「PSRAM 未启用」警告，属预期，摄像头/EI 后续适配。
; board_build.arduino.memory_type = dio_opi
; board_build.psram_type = opi
; ★ flash size 镣在 8MB：镜像头实测 V1(能跑)=0x3F(8MB)，V2(死循环)=0x4F(16MB)。
;   分区表已压缩到 8MB 内，bootloader 按 8MB 认知引导与 V1 完全同款；
;   app 仅 0.97MB，16MB 物理容量不受影响。
board_upload.flash_size = 8MB
board_build.partitions = partitions_16mb_factory.csv
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
lib_deps = 
	bblanchon/ArduinoJson@^7.4.3
lib_extra_dirs = edge-impulse
platform_packages = platformio/tool-esptoolpy@1.40500.0
